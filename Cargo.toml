[package]
name = "tabmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Safe, reproducible conversion of messy tabular sources into clean tables and workbooks"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "=4.5.60", features = ["derive", "env", "cargo", "unicode", "string"] }
csv = "1.4"
encoding_rs = "0.8"
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "3.27"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
