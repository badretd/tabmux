[package]
name = "tabmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Safe, reproducible conversion of messy tabular sources into clean tables and workbooks"

[features]
default = ["core", "excel", "html", "rust_xlsxwriter"]
core = [
    "dep:clap",
    "dep:csv",
    "dep:encoding_rs",
    "dep:globset",
    "dep:serde",
    "dep:serde_json",
    "dep:tempfile",
    "dep:thiserror",
    "dep:chrono",
    "dep:sha2",
    "dep:toml",
    "dep:walkdir",
    "dep:zip",
]
excel = ["dep:calamine", "dep:quick-xml"]
# HTML table extraction uses the built-in tolerant parser, so the feature has no
# external dependency and stays cheap enough to include in the default build.
html = []
# Library-backed XLSX writer used by the default build. A build with only
# `excel` enabled keeps the built-in manual writer as a fallback.
rust_xlsxwriter = ["excel", "dep:rust_xlsxwriter"]
# Optional SQL export/query. The real `duckdb` crate is not available in the
# offline registry used by this build, so the feature is backed by the embedded
# SQLite engine with the same CLI contract. See docs/implementation-notes.md.
sql-duckdb = ["core", "dep:rusqlite"]
# Everything in v1, including the optional SQL export/query surface.
full = ["default", "sql-duckdb"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
clap = { version = "=4.5.60", features = ["derive", "env", "cargo", "unicode", "string"], optional = true }
csv = { version = "1.4", optional = true }
encoding_rs = { version = "0.8", optional = true }
globset = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", features = ["preserve_order"], optional = true }
sha2 = { version = "0.10", optional = true }
toml = { version = "0.8", optional = true }
tempfile = { version = "3.27", optional = true }
thiserror = { version = "2.0", optional = true }
walkdir = { version = "2.5", optional = true }

# Spreadsheet reading. Pinned to the version available in the offline registry;
# the API used here is the same as the planned 0.38 line.
calamine = { version = "0.37", features = ["dates"], optional = true }
zip = { version = "9.1", default-features = false, features = ["deflate"], optional = true }
# Used only to inspect ODS packages for merged-cell spans, which calamine does
# not expose for the ODS reader.
quick-xml = { version = "0.42", optional = true }
rust_xlsxwriter = { version = "0.102", features = ["chrono", "zlib", "constant_memory", "rust_decimal"], optional = true }

# Embedded SQL engine for the sql-duckdb feature. The offline registry does not
# provide the DuckDB crate; rusqlite keeps the same export/query contract while
# the environment cannot build bundled DuckDB.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
