# cargo-deny configuration for tabmux.
#
# CI runs `cargo deny check`. The allow list is intentionally limited to
# permissive licenses compatible with the MIT OR Apache-2.0 package license.
# Review new licenses before widening this list.

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]

[bans]
version = 2
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
